name: "Tom"
role: "Small business owner"
photo: "https://static.wikia.nocookie.net/penguinsofmadagascar/images/3/3f/Skipper01.png/revision/latest/scale-to-width/360?cb=20150111185942"
goal: "Get my monthly books completed by the fifth of each month while spending no more than 1 hour organising and reviewing the work."
frustrations: "Time: I spend 6 hours each month struggling with bookkeeping, taking time away from customers.  Knowledge: I cannot confidently categorise expenses and have to look up unfamiliar transactions every month.  Money: I have a $150 monthly budget for this job and cannot afford unexpected charges."
quote: "I lost another Saturday to these books. Can someone sort them out and tell me the price upfront?"
says: "“Can you finish this month’s books, and what will it cost?”"
thinks: " How do I know this person can handle my books properly?"
does: "Keeps receipts in a folder, updates a spreadsheet on weekends, and asks other business owners for recommendations."
feels: "Frustrated about losing time and nervous about hiring someone he cannot assess."
